name: Ek Awaz Page Generator

# Every 30 minutes: builds pages for the newest posts (also posts you write in the admin panel).
# Once a day (02:25 UTC): FULL run over every post + sitemap files.
on:
  schedule:
    - cron: '7,37 * * * *'
    - cron: '25 2 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Full run (every post + sitemap)?'
        required: false
        type: boolean
        default: false

concurrency:
  group: ek-awaz-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh service-worker cache version
        run: |
          if [ -f sw.js ]; then sed -i "s/BUILD_TIMESTAMP/$(date +%Y%m%d%H%M%S)/" sw.js; fi

      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "25 2 * * *" ] || [ "${{ github.event.inputs.full }}" = "true" ]; then echo "full=1" >> "$GITHUB_OUTPUT"; else echo "full=0" >> "$GITHUB_OUTPUT"; fi

      - name: Build article pages
        env:
          FULL: ${{ steps.mode.outputs.full }}
        run: node generate-pages.js

      - name: Build sitemaps (daily)
        if: steps.mode.outputs.full == '1'
        run: node generate-sitemap.js

      - name: Commit and push
        run: |
          git config user.name  "Ek Awaz Bot"
          git config user.email "bot@ekawaznews.github.io"
          git add news/ sw.js sitemap.xml news-sitemap.xml 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Page sync: $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            echo "Push failed (attempt $i) - retrying"; git rebase --abort 2>/dev/null || true; sleep $((i * 6))
          done
          exit 1
