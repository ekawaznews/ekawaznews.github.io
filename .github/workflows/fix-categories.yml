name: Fix Categories (one-time cleanup)

on:
  workflow_dispatch:   # Manual trigger only — run this once from the Actions tab

jobs:
  fix-categories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run category cleanup
        run: node fix-categories.js
